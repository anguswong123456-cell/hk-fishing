<!DOCTYPE html>
<html lang="zh-HK">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK Fishing 通 - 香港釣魚情報誌</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <!-- Leaflet 地圖套件 -->
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
</head>
<body class="bg-slate-900 text-slate-100 font-sans min-h-screen">
  <div id="app" class="flex flex-col min-h-screen">
    
    <!-- 導航欄 -->
    <header class="bg-slate-800/90 backdrop-blur sticky top-0 z-50 border-b border-slate-700 px-4 py-3">
      <div class="max-w-7xl mx-auto flex justify-between items-center">
        <div class="flex items-center space-x-2">
          <i class="fa-solid fa-fish-fins text-2xl text-cyan-400"></i>
          <span class="text-xl font-bold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">
            HK Fishing 香港釣魚通
          </span>
        </div>
        
        <nav class="hidden md:flex space-x-6 text-sm font-medium">
          <button @click="currentTab = 'map'" :class="currentTab==='map'?'text-cyan-400 border-b-2 border-cyan-400':'text-slate-300'" class="py-1">釣點地圖</button>
          <button @click="currentTab = 'tide'" :class="currentTab==='tide'?'text-cyan-400 border-b-2 border-cyan-400':'text-slate-300'" class="py-1">天文台潮汐</button>
          <button @click="currentTab = 'ai'" :class="currentTab==='ai'?'text-cyan-400 border-b-2 border-cyan-400':'text-slate-300'" class="py-1">AI 魚種辨識</button>
        </nav>

        <button class="bg-cyan-500 hover:bg-cyan-600 text-slate-900 font-bold px-4 py-1.5 rounded-full text-sm">
          <i class="fa-solid fa-plus mr-1"></i> 分享漁獲
        </button>
      </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-7xl mx-auto px-4 py-6 flex-grow w-full">

      <!-- Step 1-1: 互動式釣點地圖區塊 -->
      <section v-show="currentTab === 'map'" class="space-y-4">
        <div class="bg-slate-800 p-4 rounded-xl border border-slate-700 flex flex-wrap gap-3 items-center justify-between">
          <div class="flex items-center space-x-2 bg-slate-900 px-3 py-2 rounded-lg border border-slate-700 flex-1 max-w-md">
            <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
            <input v-model="searchQuery" type="text" placeholder="搜尋釣點（例如：西貢、青衣大橋、東龍島）..." class="bg-transparent text-sm focus:outline-none w-full text-white">
          </div>
          <div class="flex gap-2">
            <button @click="selectedType = 'ALL'" :class="selectedType==='ALL'?'bg-cyan-500 text-slate-900':'bg-slate-700 text-slate-300'" class="px-3 py-1.5 rounded-lg text-xs font-bold">全部</button>
            <button @click="selectedType = '磯釣'" :class="selectedType==='磯釣'?'bg-cyan-500 text-slate-900':'bg-slate-700 text-slate-300'" class="px-3 py-1.5 rounded-lg text-xs font-bold">磯釣/岸釣</button>
            <button @click="selectedType = '船釣'" :class="selectedType==='船釣'?'bg-cyan-500 text-slate-900':'bg-slate-700 text-slate-300'" class="px-3 py-1.5 rounded-lg text-xs font-bold">魚排/船釣</button>
          </div>
        </div>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-6">
          <!-- Leaflet 地圖掛載區 -->
          <div class="lg:col-span-2 bg-slate-800 h-[500px] rounded-xl border border-slate-700 overflow-hidden relative z-0" id="map-container"></div>

          <!-- 釣點清單列表 -->
          <div class="space-y-3 overflow-y-auto max-h-[500px] pr-1">
            <div v-for="spot in filteredSpots" :key="spot.id" @click="focusSpot(spot)" class="bg-slate-800 p-4 rounded-xl border border-slate-700 hover:border-cyan-500/50 cursor-pointer transition">
              <div class="flex justify-between items-start">
                <div>
                  <h4 class="font-bold text-white text-base">{{ spot.name }}</h4>
                  <span class="text-xs text-slate-400"><i class="fa-solid fa-location-dot mr-1"></i>{{ spot.region }} · {{ spot.type }}</span>
                </div>
                <span class="bg-emerald-500/20 text-emerald-400 text-xs font-bold px-2.5 py-1 rounded-md border border-emerald-500/30">
                  咬口 {{ spot.score }}/10
                </span>
              </div>
              <p class="text-xs text-slate-300 mt-2">{{ spot.desc }}</p>
              <div class="mt-3 flex items-center justify-between text-xs text-slate-400 border-t border-slate-700/50 pt-2">
                <span><i class="fa-solid fa-fish text-amber-400 mr-1"></i>主攻：{{ spot.fish }}</span>
                <span class="text-cyan-400 font-medium">查看詳情 →</span>
              </div>
            </div>
          </div>
        </div>
      </section>

      <!-- Step 1-2: 潮汐展示 -->
      <section v-show="currentTab === 'tide'" class="bg-slate-800 p-6 rounded-xl border border-slate-700">
        <h3 class="text-xl font-bold mb-4">香港即時潮汐預報 (天文台數據)</h3>
        <p class="text-slate-400 text-sm">數據將自動同步香港天文台 API，為釣友提供高潮、低潮及咬口時間點。</p>
      </section>

    </main>
  </div>

  <script>
    const { createApp, ref, onMounted, computed } = Vue;

    createApp({
      setup() {
        const currentTab = ref('map');
        const searchQuery = ref('');
        const selectedType = ref('ALL');
        let map = null;
        let markers = [];

        const spots = ref([
          { id: 1, name: '西貢北潭涌/碼頭', region: '西貢', type: '磯釣', lat: 22.3965, lng: 114.3182, score: 9.2, fish: '黑臘、黃腳立', desc: '水質極佳，適合波釣法，潮水動時咬口旺。' },
          { id: 2, name: '青衣大橋海濱', region: '葵青', type: '磯釣', lat: 22.3551, lng: 114.1102, score: 8.5, fish: '石斑、鱸魚', desc: '水深流急，夜釣熱點，交通便利。' },
          { id: 3, name: '果洲群島', region: '外島', type: '船釣', lat: 22.2667, lng: 114.3667, score: 9.6, fish: '白立、紅鮪', desc: '專業磯釣/艇釣大物場，水流湍急。' },
          { id: 4, name: '東龍島碼頭/白燈台', region: '西貢', type: '磯釣', lat: 22.2520, lng: 114.2610, score: 8.8, fish: '泥鯭、石九公、黑立', desc: '香港熱點磯釣場，水深適中。' }
        ]);

        const filteredSpots = computed(() => {
          return spots.value.filter(spot => {
            const matchSearch = spot.name.includes(searchQuery.value) || spot.region.includes(searchQuery.value);
            const matchType = selectedType.value === 'ALL' || spot.type === selectedType.value;
            return matchSearch && matchType;
          });
        });

        const initMap = () => {
          // 以香港中心為原點
          map = L.map('map-container').setView([22.35, 114.18], 11);
          L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
            attribution: '&copy; OpenStreetMap contributors'
          }).addTo(map);

          renderMarkers();
        };

        const renderMarkers = () => {
          spots.value.forEach(spot => {
            const marker = L.marker([spot.lat, spot.lng]).addTo(map)
              .bindPopup(`<b>${spot.name}</b><br>主攻：${spot.fish}`);
            markers.push({ id: spot.id, marker });
          });
        };

        const focusSpot = (spot) => {
          map.setView([spot.lat, spot.lng], 14);
          const target = markers.find(m => m.id === spot.id);
          if (target) target.marker.openPopup();
        };

        onMounted(() => {
          initMap();
        });

        return { currentTab, searchQuery, selectedType, spots, filteredSpots, focusSpot };
      }
    }).mount('#app');
  </script>
</body>
</html>
